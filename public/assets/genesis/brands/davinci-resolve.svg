      <stop offset="0%" stop-color="#ff3b5c"/>
      <stop offset="100%" stop-color="#b8002a"/>
    </radialGradient>
    <radialGradient id="resBlue" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#24b6ff"/>
      <stop offset="100%" stop-color="#0062b8"/>
