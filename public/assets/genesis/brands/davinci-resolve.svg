  <rect width="512" height="512" rx="115" fill="#141416"/>
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#2c2d30" stroke-width="12"/>
  <g transform="translate(256, 256) scale(1.15)">
